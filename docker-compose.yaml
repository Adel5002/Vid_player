services:
   db:
     image: postgres
     restart: always
     environment:
       POSTGRES_PASSWORD: anime
       POSTGRES_USER: anime
       POSTGRES_DB: anime
       PGDATA: /data/postgres
     volumes:
       - db:/data/postgres
   redis:
     image: redislabs/redismod
     ports:
       - '6379:6379'
   web:
     build: .
     command: ["uvicorn", "main:app", "--host", "0.0.0.0",]
     ports:
       - "8000:8000"
     volumes:
       - .:/code
     depends_on:
       - redis
       - db
   dramatiq:
     build: .
     command: dramatiq dramatiq_actors.db_fill_actor --processes 1 --threads 1
     depends_on:
       - db
       - web
       - redis
     volumes:
       - .:/code

volumes:
  db: